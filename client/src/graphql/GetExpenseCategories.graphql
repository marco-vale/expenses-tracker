query GetExpenseCategories($options: ExpenseCategoriesOptions, $getAmount: Boolean! = true, $getDeletable: Boolean! = true) {
  expenseCategories(options: $options) {
    expenseCategories {
      id
      name
      amount @include(if: $getAmount)
      deletable @include(if: $getDeletable)
    }
    count
  }
}
