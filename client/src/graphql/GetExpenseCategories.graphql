query GetExpenseCategories($filters: ExpenseCategoriesFilters, $options: QueryOptions, $getAmount: Boolean! = true, $getDeletable: Boolean! = true) {
  expenseCategories(filters: $filters, options: $options) {
    expenseCategories {
      id
      name
      amount @include(if: $getAmount)
      deletable @include(if: $getDeletable)
    }
    count
  }
}
